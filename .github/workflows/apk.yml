name: APK bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web-Dateien nach www kopieren (alles im Repo-Stamm außer Build-Dateien)
        run: |
          mkdir -p www
          for f in *; do
            case "$f" in
              www|node_modules|package.json|package-lock.json|capacitor.config.json|patch_android.py|apk.yml|ANLEITUNG.md|res__*) ;;
              *) if [ -f "$f" ]; then cp "$f" www/; fi ;;
            esac
          done
          ls -la www
      - run: npm install
      - run: npx cap add android
      - run: python3 patch_android.py
      - run: npx cap sync android
      - name: Debug-APK bauen
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FoE-Tools-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
